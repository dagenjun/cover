<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
</style>
<title>Friendship Rescue - Dynamic Cover Preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#2a2a3a; margin:0; display:flex; justify-content:center; align-items:center; width:100%; height:100%; overflow:hidden; font-family:'Nunito',sans-serif; }
  .slide {
    width:1280px; height:720px; position:relative; overflow:hidden; flex-shrink:0;
    background:linear-gradient(150deg, #FFF7EB 0%, #FDEFF6 52%, #E9F9F3 100%);
    animation: hueShift 24s ease-in-out infinite;
  }
  @keyframes hueShift {
    0%,100% { filter:hue-rotate(0deg); }
    50% { filter:hue-rotate(8deg); }
  }

  /* --- floating bubbles --- */
  .bubble {
    position:absolute; border-radius:50%; pointer-events:none;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform:translateY(0) scale(1); opacity:0; }
    10% { opacity:var(--op,0.3); }
    90% { opacity:var(--op,0.3); }
    100% { transform:translateY(-760px) scale(1.3); opacity:0; }
  }

  /* --- soft glow blobs --- */
  .glow-blob { position:absolute; border-radius:50%; animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { transform:scale(1); opacity:0.07; }
    50% { transform:scale(1.12); opacity:0.12; }
  }


  /* --- circuit lines --- */
  .circuit { position:absolute; }
  .circuit path { stroke-dasharray:400; animation: dash 3s linear infinite; }
  @keyframes dash {
    0% { stroke-dashoffset:400; }
    100% { stroke-dashoffset:0; }
  }
  .circuit .node { animation: nodeGlow 2s ease-in-out infinite; }
  @keyframes nodeGlow {
    0%,100% { opacity:0.45; }
    50% { opacity:0.9; }
  }

  /* --- twinkle stars --- */
  .star { position:absolute; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle {
    0%,100% { opacity:0.9; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.82); }
  }
  .star.spin { animation: spinStar 8s linear infinite, twinkle 3s ease-in-out infinite; }
  @keyframes spinStar {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
  }

  /* --- wave line --- */
  .wave path { stroke-dasharray:600; animation: waveDash 4s linear infinite; }
  @keyframes waveDash {
    0% { stroke-dashoffset:0; }
    100% { stroke-dashoffset:-300; }
  }

  /* --- floating dots --- */
  .float-dot { position:absolute; animation: floatY 4s ease-in-out infinite; }
  @keyframes floatY {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-14px); }
  }

  /* --- character row --- */
  .char-row { position:absolute; top:88px; left:0; width:1280px; display:flex; justify-content:center; align-items:center; gap:92px; }
  .char-col { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .avatar-amy {
    width:88px; height:88px; border-radius:44px; border:4px solid #2FB8A0;
    background:#FFF; box-shadow:0 6px 18px rgba(22,53,94,0.12);
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    animation: floatBob 3.5s ease-in-out infinite;
  }
  @keyframes floatBob {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-8px); }
  }
  .avatar-ai {
    width:88px; height:88px; border-radius:26px;
    background:rgba(142,124,195,0.12); border:3px dashed #8E7CC3;
    display:flex; align-items:center; justify-content:center;
    animation: sway 4s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100% { transform:rotate(0deg); }
    25% { transform:rotate(-2deg); }
    75% { transform:rotate(2deg); }
  }
  .char-label { font-size:20px; font-weight:bold; color:#16355E; font-family:'Nunito',sans-serif; opacity:0.55; letter-spacing:2px; }

  /* --- rescue badge --- */
  .badge { animation: badgeFloat 4s ease-in-out infinite; }
  @keyframes badgeFloat {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-6px); }
  }
  .badge-ring { animation: spinRing 12s linear infinite; transform-origin:75px 75px; }
  @keyframes spinRing {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
  }
  .badge-heart { animation: heartbeat 1.4s ease-in-out infinite; transform-origin:75px 77px; }
  @keyframes heartbeat {
    0%,100% { transform:scale(1); }
    15% { transform:scale(1.18); }
    30% { transform:scale(1); }
    45% { transform:scale(1.12); }
    60% { transform:scale(1); }
  }
  .ai-antenna-dot { animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink {
    0%,100% { opacity:1; }
    50% { opacity:0.3; }
  }

  /* --- main title --- */
  .main-title { position:absolute; top:284px; left:0; width:1280px; text-align:center; }
  .title-line1 { font-size:58px; font-weight:bold; color:#16355E; font-family:'Montserrat',sans-serif; line-height:1.1; opacity:0; animation: fadeUp 0.8s ease-out 0.3s forwards; }
  .title-line2 { font-size:50px; font-weight:bold; color:#FF7A5C; font-family:'Montserrat',sans-serif; opacity:0; animation: fadeUp 0.8s ease-out 0.6s forwards; }
  @keyframes fadeUp {
    0% { opacity:0; transform:translateY(20px); }
    100% { opacity:1; transform:translateY(0); }
  }
  .title-wave path { stroke-dasharray:340; animation: waveDash2 3s linear infinite; }
  @keyframes waveDash2 {
    0% { stroke-dashoffset:340; }
    100% { stroke-dashoffset:0; }
  }

  /* --- title side stars --- */
  .title-star-l { position:absolute; top:258px; left:150px; animation: spinStar 8s linear infinite, twinkle 3s ease-in-out infinite; }
  .title-star-r { position:absolute; top:320px; right:170px; animation: spinStar 10s linear infinite reverse, twinkle 4s ease-in-out infinite; }
  .title-dot-r { position:absolute; top:246px; right:118px; animation: floatY 3s ease-in-out infinite; }

  /* --- sub label capsule --- */
  .sub-capsule {
    position:absolute; top:498px; left:0; width:1280px; display:flex; justify-content:center;
    opacity:0; animation: fadeIn 0.8s ease-out 1s forwards;
  }
  @keyframes fadeIn { 0% { opacity:0; transform:translateY(15px); } 100% { opacity:1; transform:translateY(0); } }
  .capsule-box {
    background:#FFF; border:2px solid #2FB8A0; border-radius:999px; padding:12px 34px;
    box-shadow:0 8px 22px rgba(47,184,160,0.18);
    animation: capsuleGlow 3s ease-in-out infinite;
  }
  @keyframes capsuleGlow {
    0%,100% { box-shadow:0 8px 22px rgba(47,184,160,0.18); }
    50% { box-shadow:0 8px 28px rgba(47,184,160,0.35); }
  }
  .capsule-text { font-size:20px; font-weight:bold; color:#2FB8A0; font-family:'Nunito',sans-serif; letter-spacing:4px; }

  /* --- brand text --- */
  .brand { position:absolute; right:56px; bottom:26px; font-size:16px; color:#16355E; opacity:0.4; font-family:'Nunito',sans-serif; letter-spacing:1px; }

  /* --- sparkle particles --- */
  .sparkle { position:absolute; pointer-events:none; animation: sparkleAnim 2s ease-in-out infinite; }
  @keyframes sparkleAnim {
    0%,100% { opacity:0; transform:scale(0); }
    50% { opacity:0.8; transform:scale(1); }
  }
</style>
</head>
